port 1194
proto udp
dev tun

ca ca.crt
cert server.crt
key server.key
dh none
tls-crypt ta.key

server 10.8.0.0 255.255.255.0
topology subnet
push "route 192.168.56.0 255.255.255.0"
push "route 192.168.57.0 255.255.255.0"

# Fattore 1: certificato client obbligatorio, firmato dalla CA
remote-cert-tls client

# Fattore 2: utente e password LDAP
plugin /usr/lib/openvpn/openvpn-auth-ldap.so /etc/openvpn/auth/auth-ldap.conf

# Il certificato deve appartenere allo stesso utente che fa login
script-security 2
auth-user-pass-verify /etc/openvpn/server/check-cn.sh via-env

data-ciphers AES-256-GCM:AES-128-GCM
keepalive 10 120
user nobody
group nogroup
persist-tun
status /var/log/openvpn/status.log
log-append /var/log/openvpn/openvpn.log
verb 3
